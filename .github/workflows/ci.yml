name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build refuses to run without a site URL, so that a deploy can never
      # ship "%VITE_SITE_URL%" into the share tags again. Set the repository
      # variable to override the default.
      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://spreebuddy.ridzwangigih.com' }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
